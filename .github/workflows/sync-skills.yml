name: Sync skills from BigBrain

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout claude-skills
        uses: actions/checkout@v7

      - name: Checkout BigBrain
        uses: actions/checkout@v7
        with:
          repository: ethanluh/BigBrain
          token: ${{ secrets.BIGBRAIN_SYNC_TOKEN }}
          path: bigbrain

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync skills
        run: node scripts/sync-skills.mjs bigbrain/.claude/skills

      - name: Rebuild manifest
        run: npm run build:manifest

      - name: Open PR with any changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "sync: pull skill content from BigBrain"
          title: "sync: pull skill content from BigBrain"
          body: Auto-generated by the `sync-skills` workflow from the latest BigBrain skill content.
          branch: sync-skills-from-bigbrain
          delete-branch: true
